[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suara-main-pipeline"
version = "0.1.0"
description = "Local SUARA integration prototype with explicit mock analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2"]

[project.scripts]
suara = "suara.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
